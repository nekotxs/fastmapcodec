plugins {
    id "net.neoforged.moddev" version "2.0.+"
}

// "Vanilla-mode": specifying a NeoForm version instead of a NeoForge version
// compiles Common against a clean, unmodified Minecraft jar -- no loader API,
// no mixin engine, nothing loader-specific. This is ModDevGradle's own
// supported mechanism for exactly this kind of cross-loader common module,
// so it stays on the same toolchain as NeoForge/build.gradle instead of
// pulling in a second, less actively maintained plugin (VanillaGradle).
//
// Exact NeoForm version for 1.21.1 -- check https://maven.neoforged.net/releases/net/neoforged/neoform/
// for other Minecraft versions.
neoForge {
    neoFormVersion = "1.21.1-20240808.144430"
}

dependencies {
    // Only needed so Common compiles against Mixin annotations.
    // The real Mixin engine is provided by the loader-specific
    // module (NeoForge/Fabric/Forge) at runtime.
    compileOnly "org.spongepowered:mixin:0.8.5"
}
