modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/YOUR_USERNAME/fastmapcodec/issues"

[[mods]]
modId = "fastmapcodec"
version = "${file.jarVersion}"
displayName = "Fast Map Codec"
description = '''
Fixes O(n^2) behavior in Mojang's BaseMapCodec (DataFixerUpper) when decoding
large map-based Codecs (e.g. player advancements). Replaces the internal
Object2ObjectArrayMap accumulator with a hashed Object2ObjectOpenHashMap.
'''

[[mixins]]
config = "fastmapcodec.mixins.json"

[[dependencies.fastmapcodec]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.fastmapcodec]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"
