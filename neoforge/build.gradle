plugins {
    id "net.neoforged.moddev" version "2.0.+"
}

base {
    archivesName = mod_id + "-neoforge"
}

sourceSets {
    mod
}

// "mod" = настоящий игровой мод (@Mod-класс + шаренные ресурсы/миксины из common).
// "main" (default sourceSet) = ITransformationService + Locator, грузится ДО
// игрового слоя -- намеренно без NeoForge/Minecraft classpath вообще.
sourceSets.mod.java.srcDir project(":common").sourceSets.main.java.srcDirs
sourceSets.mod.resources.srcDir project(":common").sourceSets.main.resources.srcDirs

neoForge {
    version = neoforge_version

    // Без этой строки sourceSets.mod компилируется практически без classpath'а --
    // именно она подключает Minecraft/NeoForge/Mixin API к "изолированному"
    // (не extends main) сорсету. См. документацию ModDevGradle: "Isolated Source Sets".
    addModdingDependenciesTo sourceSets.mod

    mods {
        fastmapcodec {
            sourceSet sourceSets.mod
        }
    }
}

dependencies {
    // main (service): ТОЛЬКО ModLauncher API.
    compileOnly "cpw.mods:modlauncher:11.0.5"
    compileOnly "cpw.mods:securejarhandler:3.0.8" // TODO: свериться с фактической версией
}

// --- Jar-in-jar: собираем "mod" отдельным jar'ом. Имя включает версию --
// FastMapCodecModLocator ищет его внутри META-INF/jarjar/ по
// префиксу/суффиксу ("fastmapcodec-" / "-mod.jar"), а не по точному имени.
tasks.register('modJar', Jar) {
    archiveFileName = "fastmapcodec-${project.version}-mod.jar"
    from sourceSets.mod.output
    manifest {
        attributes(["Implementation-Version": project.version])
    }
}

// Кладёт modJar как обычный файл внутрь service-jar'а (main), в
// META-INF/jarjar/. Это НЕ штатный jarJar-DSL NeoForge -- та машинерия
// существует для FML-шного JarInJarDependencyLocator, который этот jar
// никогда не увидит (сервисный jar с самого начала не проходит обычный скан
// модов -- в этом и была вся проблема). Нам нужно просто физически положить
// байты вложенного jar'а куда-то внутрь внешнего, откуда наш собственный
// Locator их вручную достанет через "jij:"-схему.
tasks.named('jar', Jar) {
    dependsOn tasks.named('modJar')
    into('META-INF/jarjar') {
        from tasks.named('modJar')
    }
    manifest {
        attributes(["Implementation-Version": project.version])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply plugin: "me.modmuss50.mod-publish-plugin"

publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = providers.environmentVariable("CHANGELOG").orElse("See commits for changes.")
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = !providers.environmentVariable("CI").isPresent()

    github {
        repository = "nekotxs/fastmapcodec"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        commitish = "main"
    }

    modrinth {
            projectId = "CN7axcWy"
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            minecraftVersionRange {
                start = "1.21"
                end = "26.2"
            }
    }

    curseforge {
        projectId = "1637069" // тот же ID проекта, что у neoforge-версии
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersionRange {
            start = "1.21"
            end = "26.2"
        }
    }
}
